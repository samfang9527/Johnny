name: CI and production v1 release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: johnny
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: johnny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U johnny -d johnny_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://johnny:test-only-password@127.0.0.1:5432/johnny_test
      JOHNNY_TEST_DATABASE_URL: postgresql+psycopg://johnny:test-only-password@127.0.0.1:5432/johnny_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements/dev.txt
      - name: Run database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.example.invalid' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-release:
    if: github.event_name == 'push' && vars.AWS_BUILD_ROLE_ARN != '' && vars.PRODUCTION_API_URL != ''
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ARM64 and AMD64 backend
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Upload immutable release and manifest
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if aws s3api head-object --bucket "$RELEASE_BUCKET" --key "production/v1/$RELEASE_SHA/manifest.json" >/dev/null 2>&1; then
            echo "Release manifest already exists for $RELEASE_SHA" >&2
            exit 1
          fi
          aws s3 sync frontend/dist "s3://$RELEASE_BUCKET/production/v1/$RELEASE_SHA/frontend/" --only-show-errors
          aws s3 sync deploy/v1 "s3://$RELEASE_BUCKET/production/v1/$RELEASE_SHA/deploy/" --exclude "bootstrap.sh.tftpl" --exclude "production.env.example" --only-show-errors
          python3 - <<'PY'
          import json, os
          with open('release-manifest.json', 'w') as stream:
              json.dump({'sha': os.environ['RELEASE_SHA'], 'backend_image': os.environ['ECR_REPOSITORY_URL'] + '@' + os.environ['BACKEND_DIGEST']}, stream)
          PY
          aws s3 cp release-manifest.json "s3://$RELEASE_BUCKET/production/v1/$RELEASE_SHA/manifest.json" --content-type application/json --only-show-errors
